name: K-RERA Enrichment Scraper

# Manual trigger only — go to Actions tab, pick this workflow, click "Run workflow".
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max rows to enrich (0 = all un-enriched rows)"
        required: false
        default: "0"
        type: string
      dry_run:
        description: "Dry run — parse pages but skip Supabase writes"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      re_enrich_days:
        description: "Re-enrich rows older than N days (0 = only new rows)"
        required: false
        default: "0"
        type: string

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # 5 h cap — enough for 10k rows at ~1.5 s/row

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install scraper dependencies
        run: |
          pip install --quiet \
            requests \
            beautifulsoup4 \
            python-dotenv

      - name: Run K-RERA enrichment scraper
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.limit }}" != "0" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ "${{ github.event.inputs.re_enrich_days }}" != "0" ]; then
            ARGS="$ARGS --re-enrich-days ${{ github.event.inputs.re_enrich_days }}"
          fi
          echo "Running: python 05_App/scrape_krera.py $ARGS"
          python 05_App/scrape_krera.py $ARGS

      - name: Notify
        if: always()
        run: |
          STATUS="${{ job.status }}"
          LIMIT="${{ github.event.inputs.limit }}"
          if [ "$STATUS" = "success" ]; then
            TITLE="K-RERA Enrichment passed"
            MSG="Batch (limit=$LIMIT) finished. Check Supabase for updated enriched_at rows."
            PRIORITY="default"
            TAGS="white_check_mark"
          elif [ "$STATUS" = "cancelled" ]; then
            TITLE="K-RERA Enrichment CANCELLED"
            MSG="Run #${{ github.run_number }} was cancelled after hitting the 5h timeout. Use a smaller --limit next time."
            PRIORITY="high"
            TAGS="warning"
          else
            TITLE="K-RERA Enrichment FAILED"
            MSG="Run #${{ github.run_number }} failed. Check Actions tab."
            PRIORITY="high"
            TAGS="x"
          fi
          curl -s \
            -H "Title: $TITLE" \
            -H "Priority: $PRIORITY" \
            -H "Tags: $TAGS" \
            -d "$MSG" \
            https://ntfy.sh/rera-safi-2026

      - name: Summary
        if: always()
        run: |
          echo "### K-RERA Enrichment Scraper" >> $GITHUB_STEP_SUMMARY
          echo "Run \`${{ github.run_number }}\` finished with status: **${{ job.status }}**" >> $GITHUB_STEP_SUMMARY
          echo "Inputs: limit=${{ github.event.inputs.limit }}, dry_run=${{ github.event.inputs.dry_run }}, re_enrich_days=${{ github.event.inputs.re_enrich_days }}" >> $GITHUB_STEP_SUMMARY
