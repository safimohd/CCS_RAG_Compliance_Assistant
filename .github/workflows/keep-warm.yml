name: keep apps warm

on:
  schedule:
    - cron: "*/25 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Wake both Streamlit apps
        env:
          HEALTHCARE_URL: https://ccsragcomplianceassistant-6hug2utprjrpwtyijwjanr.streamlit.app
          RERA_URL: https://ccsragcomplianceassistant-cisyv46xzq7kte95ywkmhg.streamlit.app
        run: |
          ping_app() {
            local name="$1"
            local url="$2"
            local max_attempts=5
            local attempt=1
            local code

            echo "--- $name ---"
            while [ $attempt -le $max_attempts ]; do
              start=$(date +%s)
              code=$(curl -sS -L -o /dev/null -w '%{http_code}' \
                       --max-time 60 "$url" 2>/dev/null || echo "000")
              took=$(( $(date +%s) - start ))
              echo "Attempt $attempt: HTTP $code in ${took}s"

              if [ "$code" = "200" ]; then
                echo "$name is awake"
                return 0
              fi

              echo "Not ready yet (HTTP $code) -- waiting 30s..."
              sleep 30
              attempt=$(( attempt + 1 ))
            done

            echo "::warning::$name did not reach 200 after $max_attempts attempts"
            return 0
          }

          ping_app "Healthcare" "$HEALTHCARE_URL"
          ping_app "RERA" "$RERA_URL"
          echo "Done."
