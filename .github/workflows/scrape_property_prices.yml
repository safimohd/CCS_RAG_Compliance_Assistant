name: Bangalore Property Price Scraper

# Manual trigger only — go to Actions tab, pick this workflow, click "Run workflow".
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — scrape and print, skip Supabase writes"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --quiet requests beautifulsoup4 python-dotenv

      - name: Run property price scraper
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          echo "Running: python 05_App/scrape_property_prices.py $ARGS"
          python 05_App/scrape_property_prices.py $ARGS

      - name: Notify
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            TITLE="Property Price Scraper passed"
            MSG="NoBroker 2026 locality prices updated in Supabase."
            PRIORITY="default"
            TAGS="white_check_mark"
          else
            TITLE="Property Price Scraper FAILED"
            MSG="Run #${{ github.run_number }} failed. Check Actions tab."
            PRIORITY="high"
            TAGS="x"
          fi
          curl -s \
            -H "Title: $TITLE" \
            -H "Priority: $PRIORITY" \
            -H "Tags: $TAGS" \
            -d "$MSG" \
            https://ntfy.sh/rera-safi-2026

      - name: Summary
        if: always()
        run: |
          echo "### Bangalore Property Price Scraper" >> $GITHUB_STEP_SUMMARY
          echo "Run \`${{ github.run_number }}\` finished: **${{ job.status }}**" >> $GITHUB_STEP_SUMMARY
          echo "Source: NoBroker 2026 locality rates, dry_run=${{ github.event.inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
