name: Estimate 2026 Bangalore Property Prices

# Manual trigger only — go to Actions tab, pick this workflow, click "Run workflow".
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — compute and print estimates, skip Supabase writes"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --quiet requests beautifulsoup4 pandas python-dotenv

      - name: Run estimator
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          echo "Running: python 05_App/estimate_2026_prices.py $ARGS"
          python 05_App/estimate_2026_prices.py $ARGS

      - name: Summary
        if: always()
        run: |
          echo "### 2026 Property Price Estimator" >> $GITHUB_STEP_SUMMARY
          echo "Run \`${{ github.run_number }}\` finished: **${{ job.status }}**" >> $GITHUB_STEP_SUMMARY
          echo "Sources: NoBroker 2026 (live scrape) + Kaggle 2017 CSV" >> $GITHUB_STEP_SUMMARY
          echo "Method: locality-specific scaling factors + zone-based proxy" >> $GITHUB_STEP_SUMMARY
          echo "dry_run=${{ github.event.inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
